name: Backend Health Check
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Railway backend is alive
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://web-production-f17a7.up.railway.app/docs)
          if [ $response -eq 200 ]; then
            echo "Backend is healthy"
          else
            echo "Backend health check failed with status $response"
            exit 1
          fi
